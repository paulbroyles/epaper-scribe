blueprint:
  name: "E-Paper Display Control (296×128 BWR)"
  description: >
    Manually send a specific content mode to a 296×128 black/white/red
    e-ink display. Choose the mode each time you run the script — from a
    dashboard button, Developer Tools, or another automation.

    Pairs with the "Now Playing with Calendar Fallback" automation blueprint,
    which handles reactive triggering. Use this script for manual overrides.

    Requires the E-Paper Scribe integration with the appropriate config
    entries set up.
  domain: script
  input:
    epaper_device:
      name: E-Paper Display Device
      description: The OpenEPaperLink display device to drive.
      selector:
        device:
    now_playing_entry_id:
      name: Now Playing Entry ID
      description: >
        Leave blank if you only have one Now Playing entry.
      default: ""
      selector:
        text:
    saints_day_entry_id:
      name: Saints Day Entry ID
      description: >
        Leave blank if you only have one Liturgical Calendar entry.
      default: ""
      selector:
        text:
    word_of_day_entry_id:
      name: Word of the Day Entry ID
      description: >
        Leave blank if you only have one Word of the Day entry.
      default: ""
      selector:
        text:

fields:
  mode:
    name: Display Mode
    description: Which content to show on the display.
    required: true
    selector:
      select:
        options:
          - label: "Now Playing"
            value: "now_playing"
          - label: "Liturgical Calendar"
            value: "calendar"
          - label: "Word of the Day"
            value: "word_of_day"

variables:
  np_entry: !input now_playing_entry_id
  sd_entry: !input saints_day_entry_id
  wod_entry: !input word_of_day_entry_id

sequence:
  - choose:

      # --- Now Playing ---
      - conditions: "{{ mode == 'now_playing' }}"
        sequence:
          - service: epaper_scribe.render_now_playing
            data: "{{ {'entry_id': np_entry} if np_entry else {} }}"
            response_variable: np_result
          - service: open_epaper_link.drawcustom
            target:
              device_id: !input epaper_device
            data:
              background: white
              rotate: 0
              dither: 0
              payload:
                - type: dlimg
                  url: "/local/epaper_scribe/now_playing_artwork_128.png"
                  x: 0
                  y: 0
                  xsize: 128
                  ysize: 128
                  resize_method: stretch
                - type: line
                  x_start: 128
                  y_start: 0
                  x_end: 128
                  y_end: 128
                  fill: black
                  width: 1
                - type: rectangle
                  x_start: 129
                  y_start: 0
                  x_end: 295
                  y_end: 38
                  fill: red
                  outline: red
                - type: text
                  value: "{{ np_result.creator | default('') }}"
                  x: 135
                  y: 11
                  size: 16
                  font: ppb.ttf
                  color: white
                  max_width: 153
                  truncate: true
                - type: text
                  value: "{{ np_result.title | default('') }}"
                  x: 135
                  y: 46
                  size: 18
                  font: ppb.ttf
                  color: black
                  max_width: 153
                  spacing: 2
                - type: text
                  value: "{{ np_result.container | default('') }}"
                  x: 135
                  y: 90
                  size: 13
                  font: rbm.ttf
                  color: black
                  max_width: 153
                  spacing: 2

      # --- Liturgical Calendar ---
      - conditions: "{{ mode == 'calendar' }}"
        sequence:
          - service: epaper_scribe.render_saints_day
            data: "{{ {'entry_id': sd_entry} if sd_entry else {} }}"
            response_variable: sd_result
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ sd_result.has_saint }}"
                sequence:
                  - service: open_epaper_link.drawcustom
                    target:
                      device_id: !input epaper_device
                    data:
                      background: white
                      rotate: 0
                      dither: 0
                      payload:
                        - type: rectangle
                          x_start: 0
                          y_start: 0
                          x_end: 295
                          y_end: 28
                          fill: red
                          outline: red
                        - type: text
                          value: >-
                            {{ sd_result.week if sd_result.week
                               else sd_result.season }}
                          x: 6
                          y: 6
                          size: 13
                          font: rbm.ttf
                          color: white
                          max_width: 283
                          truncate: true
                        - type: dlimg
                          url: "/local/epaper_scribe/saints_day_artwork_64.png"
                          x: 0
                          y: 28
                          xsize: 64
                          ysize: 64
                          resize_method: cover
                        - type: line
                          x_start: 64
                          y_start: 28
                          x_end: 64
                          y_end: 128
                          fill: black
                          width: 1
                        - type: text
                          value: "{{ sd_result.saint_name | default('') }}"
                          x: 70
                          y: 32
                          size: 16
                          font: ppb.ttf
                          color: black
                          max_width: 218
                          truncate: true
                        - type: text
                          value: "{{ sd_result.saint_role | default('') }}"
                          x: 70
                          y: 54
                          size: 13
                          font: rbm.ttf
                          color: black
                          max_width: 218
                          truncate: true
                        - type: line
                          x_start: 70
                          y_start: 72
                          x_end: 290
                          y_end: 72
                          fill: black
                          width: 1
                        - type: text
                          value: "{{ sd_result.description | default('') }}"
                          x: 70
                          y: 78
                          size: 11
                          font: rbm.ttf
                          color: black
                          max_width: 218
                          spacing: 2
            default:
              - service: open_epaper_link.drawcustom
                target:
                  device_id: !input epaper_device
                data:
                  background: white
                  rotate: 0
                  dither: 0
                  payload:
                    - type: rectangle
                      x_start: 0
                      y_start: 0
                      x_end: 295
                      y_end: 28
                      fill: black
                      outline: black
                    - type: text
                      value: >-
                        {{ sd_result.week if sd_result.week
                           else sd_result.season }}
                      x: 6
                      y: 6
                      size: 13
                      font: rbm.ttf
                      color: white
                      max_width: 283
                      truncate: true
                    - type: text
                      value: "{{ sd_result.season_description | default('') }}"
                      x: 70
                      y: 34
                      size: 14
                      font: rbm.ttf
                      color: black
                      max_width: 218
                      spacing: 3
                    - type: text
                      value: "{{ now().strftime('%A, %-d %B') }}"
                      x: 70
                      y: 112
                      size: 11
                      font: rbm.ttf
                      color: black
                      max_width: 218
                      truncate: true

      # --- Word of the Day ---
      - conditions: "{{ mode == 'word_of_day' }}"
        sequence:
          - service: epaper_scribe.render_word_of_day
            data: "{{ {'entry_id': wod_entry} if wod_entry else {} }}"
            response_variable: wod_result
          - service: open_epaper_link.drawcustom
            target:
              device_id: !input epaper_device
            data:
              background: white
              rotate: 0
              dither: 0
              payload:
                - type: rectangle
                  x_start: 0
                  y_start: 0
                  x_end: 295
                  y_end: 28
                  fill: black
                  outline: black
                - type: text
                  value: "{{ wod_result.word | default('') | upper }}"
                  x: 8
                  y: 6
                  size: 16
                  font: ppb.ttf
                  color: white
                  max_width: 200
                  truncate: true
                - type: text
                  value: "{{ wod_result.part_of_speech | default('') }}"
                  x: 215
                  y: 10
                  size: 11
                  font: rbm.ttf
                  color: white
                  max_width: 75
                  truncate: true
                - type: text
                  value: "{{ wod_result.definition | default('') }}"
                  x: 8
                  y: 36
                  size: 13
                  font: rbm.ttf
                  color: black
                  max_width: 280
                  spacing: 3
                - type: text
                  value: >-
                    {{ ('"' + wod_result.example + '"')
                       if wod_result.example | default('') else '' }}
                  x: 8
                  y: 96
                  size: 11
                  font: rbm.ttf
                  color: red
                  max_width: 280
                  truncate: true

mode: parallel
max: 3
